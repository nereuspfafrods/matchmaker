<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make ArtScience interfaculty again</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="info-box">
      <h3>NEW METHOD FOR SHAPING ARTSCIENCE!</h3>
      <p>
        ArtScience matchmaker helps artscience find it's compatability with
        other departments, mediums, approaches, ect.
      </p>
      <p>Suggestions are very welcome</p>
    </div>

    <div class="card">
      <div class="container">
        <h1>❤️ ArtScience MatchMaker ❤️</h1>

        <div class="inputs">
          <input type="text" id="name1" placeholder="..." />
          <input type="text" id="name2" placeholder="..." />
        </div>

        <button onclick="calculateLove()">Calculate</button>

        <div class="heart-wrapper">
          <div class="heart">
            <div class="fill" id="fill"></div>
            <div class="percent" id="percentage">0%</div>
          </div>
        </div>

        <h2 id="resultText"></h2>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
